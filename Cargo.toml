[package]
name = "boids-wasm"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["cdylib"]

[dependencies]
getrandom = { version = "0.4.2", features = ["wasm_js"] }
kiddo = { version = "6.3.0", features = ["multi-threaded", "simd"] }
nalgebra = { version = "0.34.2" }
rand = "0.10.1"
wasm-bindgen = "0.2.121"

[dependencies.web-sys]
version = "0.3.98"
features = [
  'Document',
  'Element',
  'HtmlElement',
  'Node',
  'Window',
  'HtmlCanvasElement',
  'CanvasRenderingContext2d',
  'MouseEvent',
  'console'
]

[profile.release]
debug = false