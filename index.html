<html>
    <head>
        <meta content="text/html;charset=utf-8" http-equiv="Content-Type"/>
        <title>Boids</title>
    </head>
    <body>
        <h1>Boids!</h1>
        <canvas width="800" height="800" id="canvas"></canvas>
        <pre id="performance"></pre>
        <script type="importmap">
         {
             "imports": {
                 "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
                 "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.webgpu.js",
                 "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.tsl.js",
                 "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"
             }
         }
        </script>
        <script type="module">
         import init, { Simulation } from './pkg/boids.js';

			   import * as THREE from 'three/webgpu';
			   import { mix, range, normalWorld, oscSine, time } from 'three/tsl';

			   import { Inspector } from 'three/addons/inspector/Inspector.js';
         import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

         const D = 2;

         function run3D(memory, simulation) {
             const canvas = document.querySelector("#canvas");
             canvas.hidden = true;

             const count = simulation.num_boids();

             let camera, scene, renderer, controls;
             let mesh;
             let magnetMesh;

             const dummy = new THREE.Object3D();

             let frame = 0;
             let magnetPosition = new Float64Array([0, 0, 0]);

             async function render() {
                 simulation.tick();
                 const stride = 6;

                 const positionsAndVelocities = new Float64Array(
                     memory.buffer,
                     simulation.boids(),
                     simulation.num_boids() * stride,
                 );

                 for (let i = 0; i < simulation.num_boids(); i++) {
                     const [x, y, z, vx, vy, vz] = positionsAndVelocities.slice(stride * i, stride * (i + 1));

                     dummy.position.set(x, y, z);
                     dummy.updateMatrix();

                     mesh.setMatrixAt(i, dummy.matrix);
                 }

                 if (frame % 300 === 0) {
                     magnetPosition = new Float64Array(
                         memory.buffer,
                         simulation.get_magnet(),
                         3,
                     );
                     console.log(magnetPosition);
                     magnetMesh.position.set(...magnetPosition);
                 }

                 await renderer.render(scene, camera);

                 frame += 1;
             }

             function animate() {
                 render();
             }

             function init() {
				         renderer = new THREE.WebGPURenderer( { antialias: true } );
                 renderer.setPixelRatio(window.devicePixelRatio);
                 renderer.setSize(800, 800);
                 renderer.setAnimationLoop(animate);
                 renderer.inspector = new Inspector();

                 document.body.appendChild(renderer.domElement);

                 camera = new THREE.PerspectiveCamera(90, canvas.width / canvas.height, 1, 1000);
                 camera.position.set(10, 10, 10);
                 camera.lookAt(0, 0, 0);

                 scene = new THREE.Scene();

                 const material = new THREE.MeshPhongMaterial();
                 material.color = new THREE.Color("rgb(200, 200, 255)");
                 material.shininess = 100;

                 const geometry = new THREE.SphereGeometry( 1, 32, 16 );
                 geometry.scale(0.09, 0.09, 0.09);

                 mesh = new THREE.InstancedMesh(geometry, material, count);
                 mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
                 scene.add(mesh);

                 const magnetMaterial = new THREE.MeshPhongMaterial();
                 magnetMaterial.color = new THREE.Color("rgb(0, 255, 0)");
                 magnetMesh = new THREE.Mesh(geometry, magnetMaterial);
                 scene.add(magnetMesh);

                 const axesHelper = new THREE.AxesHelper( 5 );
                 scene.add(axesHelper);

                 const light = new THREE.DirectionalLight(0xffffff, 1);
                 light.position.set(0, 0, 10);
                 light.target.position.set(-5, 0, 0);
                 scene.add(light);
                 scene.add(light.target);

                 const skyColor = 0xB1E1FF;  // light blue
                 const groundColor = 0xB97A20;  // brownish orange
                 const hemisphereLight = new THREE.HemisphereLight(skyColor, groundColor, 1);
                 scene.add(hemisphereLight);

                 const xyPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
                 const yzPlane = new THREE.Plane(new THREE.Vector3(1, 0, 0), 0);
                 const zxPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
                 scene.add(new THREE.PlaneHelper(xyPlane, 10, 0x000000));
                 scene.add(new THREE.PlaneHelper(yzPlane, 10, 0x000000));
                 scene.add(new THREE.PlaneHelper(zxPlane, 10, 0x000000));

                 const gui = renderer.inspector.createParameters('Settings');
                 controls = new OrbitControls(camera, renderer.domElement);
             }

             init();

         }

         function run2D(memory, simulation) {
             const canvas = document.querySelector("#canvas");
             const ctx = canvas.getContext("2d");

             const toCanvasCoordinates = (x, y) => {
                 return [
                     (x - 0.5) * canvas.width / 16 + canvas.width / 2,
                     (y - 0.5) * canvas.height / 16 + canvas.height / 2,
                 ];
             }

             ctx.fillStyle = "lightblue";

             let frame = 0;
             let magnetPosition = new Float64Array([0.5, 0.5]);

             const performanceGauge = document.querySelector("#performance");

             const renderLoop = () => {
                 const t0 = performance.now();
                 simulation.tick();
                 const t1 = performance.now();

                 ctx.clearRect(0, 0, canvas.width, canvas.height);
                 ctx.fillRect(0, 0, canvas.width, canvas.height);
                 ctx.strokeStyle = "black";
                 ctx.beginPath();

                 const stride = 4;
                 // const stride = 6;
                 const positionsAndVelocities = new Float64Array(
                     memory.buffer,
                     simulation.boids(),
                     simulation.num_boids() * stride,
                 );

                 for (let i = 0; i < simulation.num_boids(); i++) {
                     const [x, y, vx, vy] = positionsAndVelocities.slice(stride * i, stride * (i + 1));
                     // const [x, y, z, vx, vy, vz] = positionsAndVelocities.slice(stride * i, stride * (i + 1));
                     const [cx, cy] = toCanvasCoordinates(x, y);
                     const [bx, by] = toCanvasCoordinates(x - 5 * vx, y - 5 * vy);
                     const r = 1.5;

                     ctx.moveTo(cx, cy)
                     ctx.arc(cx - r, cy, r, 0.0, 2.0 * Math.PI);
                     ctx.moveTo(bx, by);
                     ctx.lineTo(cx - r, cy);
                 }

                 ctx.stroke();

                 ctx.strokeStyle = "red";
                 ctx.beginPath();
                 const [cx, cy] = toCanvasCoordinates(...magnetPosition);
                 ctx.moveTo(cx, cy);
                 ctx.arc(cx - 5.0, cy, 5.0, 0.0, 2.0 * Math.PI);
                 ctx.stroke();

                 if (frame % 300 === 0) {
                     magnetPosition = new Float64Array(
                         memory.buffer,
                         simulation.get_magnet(),
                         2,
                     );
                 }

                 frame += 1;

                 const t2 = performance.now();
                 if (frame % 5 == 0) {
                     const rate = (1 / (t2 - t0) * 1e3).toFixed(2);
                    performanceGauge.innerHTML = `tick: ${(t1 - t0).toFixed(2)} ms, drawing: ${(t2 - t1).toFixed(2)} ms, fps: ${rate}`;
                 }

                 requestAnimationFrame(() => renderLoop());
             }

             requestAnimationFrame(() => renderLoop());
         }

         async function run() {
             const module = await init();
             console.log(module);

             const memory = module.memory;
             const simulation = Simulation.new(1.0, 500);

             // run2D(memory, simulation);
             run3D(memory, simulation);
         }

         run();
        </script>
    </body>
</html>
