<html>
    <head>
        <meta content="text/html;charset=utf-8" http-equiv="Content-Type"/>
        <title>Boids</title>
    </head>
    <body>
        <h1>Boids!</h1>
        <div id="boids-canvas-container">
            <canvas width="1200" height="800" id="canvas"></canvas>
            <div id="boids-stats"></div>
            <pre id="performance"></pre>
            <div id="boids-fullscreen-icon">⛶</div>
        </div>
        <script type="module" src="./build/boids.js"></script>
        <style>
         #boids-canvas-container {
             position: relative;
             width: fit-content;
         }

         .lil-root {
             position: absolute;
             top: 0px;
             right: 0px;
         }

         #boids-stats > div {
             position: absolute !important;
         }

         #boids-fullscreen-icon {
             cursor: pointer;
             position: absolute;
             bottom: 10px;
             right: 10px;
             color: #fff;
             font-size: 32px;
         }
        </style>
    </body>
</html>
