<html>
    <head>
        <meta content="text/html;charset=utf-8" http-equiv="Content-Type"/>
        <title>Boids</title>
    </head>
    <body>
        <h1>Boids!</h1>
        <div id="boids-canvas-container">
            <canvas width="1200" height="800" id="canvas"></canvas>
            <div id="boids-stats"></div>
            <pre id="performance"></pre>
        </div>
        <script type="importmap">
         {
             "imports": {
                 "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
                 "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.webgpu.js",
                 "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.tsl.js",
                 "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/",
                 "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.21/+esm",
                 "stats-gl": "https://cdn.jsdelivr.net/npm/stats-gl@4.1.0/+esm"
             }
         }
        </script>
        <script type="module" src="./main.js"></script>
        <style>
         #boids-canvas-container {
             position: relative;
             width: fit-content;
         }

         .lil-root {
             position: absolute;
             top: 0px;
             right: 0px;
         }

         #boids-stats > div {
             position: absolute !important;
         }
        </style>
    </body>
</html>
